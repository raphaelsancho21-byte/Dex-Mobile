
name: Build DEX Mobile APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Compilar DEX Mobile
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verificar Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          if [ ! -d "$ANDROID_HOME" ]; then
            echo "::error::Android SDK nao encontrado"
            exit 1
          fi

          ls "$ANDROID_HOME/platforms"

      - name: Localizar projeto Android
        id: project
        shell: bash
        run: |
          PROJECT=$(find DEX-Security-V0.1 \
            -type f \( \
              -name "settings.gradle" -o \
              -name "settings.gradle.kts" \
            \) -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "::error::Projeto Android nao encontrado"
            exit 1
          fi

          DIR=$(dirname "$PROJECT")

          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Projeto encontrado em: $DIR"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK Debug
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          echo "Iniciando compilacao do DEX Mobile"

          if [ -f ./gradlew ]; then
            echo "Gradle Wrapper encontrado"
            chmod +x ./gradlew

            ./gradlew assembleDebug --stacktrace

          else
            echo "Gradle Wrapper nao encontrado"
            echo "Tentando gerar automaticamente"

            gradle wrapper --gradle-version 8.7

            chmod +x ./gradlew

            ./gradlew assembleDebug --stacktrace
          fi

      - name: Verificar APK gerado
        shell: bash
        run: |
          echo "Procurando APK..."

          find DEX-Security-V0.1 \
            -type f -name "*.apk" -print

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: DEX-Mobile-Debug
          path: |
            DEX-Security-V0.1/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
