
name: Build DEX Mobile APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verificar Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/platforms"

      - name: Localizar projeto Android
        id: project
        shell: bash
        run: |
          PROJECT=$(find DEX-Security-V0.1 \
            -type f \( \
              -name "settings.gradle" -o \
              -name "settings.gradle.kts" \
            \) -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "::error::Projeto Gradle nao encontrado"
            exit 1
          fi

          DIR=$(dirname "$PROJECT")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

          echo "Projeto encontrado em: $DIR"

      - name: Compilar APK Debug
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          if [ ! -f ./gradlew ]; then
            echo "::error::Gradle Wrapper nao encontrado"
            exit 1
          fi

          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: DEX-Mobile-Debug
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 30
